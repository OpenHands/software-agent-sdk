[project]
name = "openhands-tools"
version = "1.49.6"
description = "OpenHands Tools - Runtime tools for AI agents"

requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "binaryornot>=0.4.4",
    "cachetools",
    "libtmux>=0.53.0",
    "pydantic>=2.11.7",
    # 0.12+ pins exact openai versions (==2.16.0 or ==2.26.0) incompatible with
    # our openai>=2.33.0 floor; keep to 0.11.x until upstream relaxes its pin.
    # See: https://github.com/OpenHands/software-agent-sdk/issues/5152
    "browser-use>=0.8.0,<0.12",
    "func-timeout>=4.3.5",
    "tom-swe>=1.0.3",
]

[project.urls]
Source = "https://github.com/OpenHands/software-agent-sdk"
Homepage = "https://github.com/OpenHands/software-agent-sdk"
Documentation = "https://docs.openhands.dev/sdk"
"Bug Tracker" = "https://github.com/OpenHands/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.tools*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "**/*.j2"]
"openhands.tools.preset.subagents" = ["*.md"]
