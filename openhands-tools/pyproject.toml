[project]
name = "openhands-tools"
version = "1.29.3"
description = "OpenHands Tools - Runtime tools for AI agents"

requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "binaryornot>=0.4.4",
    "cachetools",
    "libtmux>=0.53.0",
    "pydantic>=2.11.7",
    "browser-use>=0.8.0",
    "func-timeout>=4.3.5",
    "tom-swe>=1.0.3",
    "httpx>=0.27",
    "py-landlock>=0.1.1; sys_platform == 'linux'",
    "pyromind-sdk==0.1.7rc1; python_full_version < '3.14'",
    "huggingface_hub>=0.25",
    "pillow>=12.1.1",
    "pyarrow>=17.0",
]

[project.urls]
Source = "https://github.com/OpenHands/software-agent-sdk"
Homepage = "https://github.com/OpenHands/software-agent-sdk"
Documentation = "https://docs.openhands.dev/sdk"
"Bug Tracker" = "https://github.com/OpenHands/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.tools*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "**/*.j2"]
"openhands.tools.preset.subagents" = ["*.md"]
"openhands.tools.terminal.apparmor" = ["*.profile"]
