sonar.projectKey=software-agent-sdk
sonar.projectName=software-agent-sdk

# Four namespace packages. tests/ is top level, so sources and tests are already
# disjoint -- SonarQube aborts if a file is reachable from both.
sonar.sources=openhands-sdk,openhands-tools,openhands-agent-server,openhands-workspace
sonar.tests=tests

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
