---
# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # GitHub Actions
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: cron
          cronjob: "0 * * * *"
      commit-message:
          prefix: chore(deps)

    # Python (uv) — workspace support landed in dependabot-core v0.374.0
    # (https://github.com/dependabot/dependabot-core/pull/14627, May 2026).
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: cron
          cronjob: "0 * * * *"
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore(deps)

    - package-ecosystem: npm
      directory: /clients/typescript
      cooldown:
          default-days: 7
      schedule:
          interval: cron
          cronjob: "0 * * * *"
      commit-message:
          prefix: chore(deps)
