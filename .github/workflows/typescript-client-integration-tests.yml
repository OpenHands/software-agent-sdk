---
name: TypeScript client integration tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            llm_model:
                description: LLM model to use for tests
                required: false
                default: anthropic/claude-sonnet-4-5-20250929

env:
    AGENT_SERVER_PORT: 8010
    HOST_WORKSPACE_DIR: /tmp/agent-workspace
    AGENT_WORKSPACE_DIR: /workspace
    # integration-test builds this from the branch and loads it straight into the
    # runner's daemon, never pushing, so fork PRs need no registry credentials.
    # smoke-test deliberately stays on the pinned release image.
    BRANCH_AGENT_SERVER_IMAGE: agent-server:branch-build

defaults:
    run:
        working-directory: clients/typescript

jobs:
    integration-test:
        runs-on: ubuntu-latest
        # Raised from 30: this job now builds the agent-server image itself.
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Install dependencies
              run: npm ci

            - name: Build package
              run: npm run build

            - name: Create workspace directory
              run: |
                  mkdir -p ${{ env.HOST_WORKSPACE_DIR }}
                  chmod 777 ${{ env.HOST_WORKSPACE_DIR }}

            - name: Prepare agent-server build context
              id: agent_server_ctx
              working-directory: .
              run: |
                  uv sync --frozen
                  uv run ./openhands-agent-server/openhands/agent_server/docker/build.py \
                      --build-ctx-only --arch amd64 \
                      --base-image nikolaik/python-nodejs:python3.13-nodejs22-slim

            - name: Build agent-server image from this branch
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
              with:
                  context: ${{ steps.agent_server_ctx.outputs.build_context }}
                  file: ${{ steps.agent_server_ctx.outputs.dockerfile }}
                  # `source` skips the pyinstaller stage that `binary` needs. Every
                  # layer beneath it is shared, so the cache below still applies.
                  target: source
                  platforms: linux/amd64
                  push: false
                  load: true
                  tags: ${{ env.BRANCH_AGENT_SERVER_IMAGE }}
                  # Scope server.yml populates with mode=max on push to main.
                  cache-from: type=gha,scope=agent-server-python-amd64
                  build-args: |
                      BASE_IMAGE=nikolaik/python-nodejs:python3.13-nodejs22-slim
                      OPENHANDS_BUILD_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
                      OPENHANDS_BUILD_GIT_REF=${{ github.head_ref != '' && format('refs/heads/{0}', github.head_ref) || github.ref }}
                      INSTALL_ACP_PROVIDERS=claude-code,codex,gemini-cli
                      INSTALL_CAPABILITIES=vscode,browser,docker

            - name: Show built image
              run: docker images ${{ env.BRANCH_AGENT_SERVER_IMAGE }}

            - name: Start agent-server container
              run: |
                  docker run -d \
                    --name agent-server \
                    -p 127.0.0.1:${{ env.AGENT_SERVER_PORT }}:8000 \
                    -v ${{ env.HOST_WORKSPACE_DIR }}:${{ env.AGENT_WORKSPACE_DIR }} \
                    -e LOG_JSON=true \
                    ${{ env.BRANCH_AGENT_SERVER_IMAGE }} --host 0.0.0.0

                  # Wait for container to start
                  sleep 5

                  # Check container is running
                  docker ps
                  docker logs agent-server

            - name: Wait for agent-server to be ready
              run: |
                  echo "Waiting for agent-server to be ready..."
                  max_retries=30
                  retry_count=0
                  while [ $retry_count -lt $max_retries ]; do
                    if curl -s http://localhost:${{ env.AGENT_SERVER_PORT }}/health > /dev/null 2>&1; then
                      echo "Agent server is ready!"
                      break
                    fi
                    echo "Retry $((retry_count + 1))/$max_retries..."
                    sleep 2
                    retry_count=$((retry_count + 1))
                  done

                  if [ $retry_count -eq $max_retries ]; then
                    echo "Agent server failed to start"
                    docker logs agent-server
                    exit 1
                  fi

                  # Show server info
                  curl http://localhost:${{ env.AGENT_SERVER_PORT }}/server_info

            - name: Run deterministic integration tests
              env:
                  AGENT_SERVER_URL: http://localhost:${{ env.AGENT_SERVER_PORT }}
                  HOST_WORKSPACE_DIR: ${{ env.HOST_WORKSPACE_DIR }}
                  AGENT_WORKSPACE_DIR: ${{ env.AGENT_WORKSPACE_DIR }}
                  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
                  LLM_MODEL: ${{ github.event.inputs.llm_model || secrets.LLM_MODEL || 'anthropic/claude-sonnet-4-5-20250929' }}
                  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
                  TEST_TIMEOUT: 180000
              run: npm run test:integration:deterministic

            - name: Run LLM-backed integration tests
              env:
                  AGENT_SERVER_URL: http://localhost:${{ env.AGENT_SERVER_PORT }}
                  HOST_WORKSPACE_DIR: ${{ env.HOST_WORKSPACE_DIR }}
                  AGENT_WORKSPACE_DIR: ${{ env.AGENT_WORKSPACE_DIR }}
                  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
                  LLM_MODEL: ${{ github.event.inputs.llm_model || secrets.LLM_MODEL || 'anthropic/claude-sonnet-4-5-20250929' }}
                  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
                  TEST_TIMEOUT: 180000
              run: |
                  if [ -z "$LLM_API_KEY" ]; then
                    echo "⚠️ LLM_API_KEY secret not set - skipping LLM-backed integration tests"
                    exit 0
                  fi

                  npm run test:integration:llm

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: integration-test-results
                  path: |
                      clients/typescript/coverage/
                      clients/typescript/junit.xml
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Show container logs on failure
              if: failure()
              run: |
                  echo "=== Agent Server Logs ==="
                  docker logs agent-server
                  echo ""
                  echo "=== Workspace Contents ==="
                  ls -la ${{ env.HOST_WORKSPACE_DIR }} || true

            - name: Cleanup
              if: always()
              run: |
                  docker stop agent-server || true
                  docker rm agent-server || true
                  rm -rf ${{ env.HOST_WORKSPACE_DIR }} || true

  # Separate job for quick smoke test without LLM
    smoke-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Resolve agent-server image
              run: |
                  echo "AGENT_SERVER_IMAGE=$(node -p 'require("./package.json").config.agentServerImage')" >> "$GITHUB_ENV"

            - name: Build package
              run: npm run build

            - name: Create workspace directory
              run: |
                  mkdir -p /tmp/agent-workspace
                  chmod 777 /tmp/agent-workspace

            - name: Pull and start agent-server
              run: |
                  docker pull ${{ env.AGENT_SERVER_IMAGE }}
                  docker run -d \
                    --name agent-server \
                    -p 127.0.0.1:8010:8000 \
                    -v /tmp/agent-workspace:/workspace \
                    ${{ env.AGENT_SERVER_IMAGE }} --host 0.0.0.0

                  # Wait for server
                  sleep 10

            - name: Smoke test - server health
              run: |
                  # Test server is responding
                  curl -f http://localhost:8010/alive
                  curl -f http://localhost:8010/health
                  curl http://localhost:8010/server_info

            - name: Smoke test - workspace command execution
              env:
                  AGENT_SERVER_URL: http://localhost:8010
                  HOST_WORKSPACE_DIR: /tmp/agent-workspace
                  AGENT_WORKSPACE_DIR: /workspace
                  LLM_API_KEY: dummy-key-for-smoke-test
                  LLM_MODEL: dummy/model
              run: |
                  # Just check that the TypeScript client can connect
                  # This doesn't need a real LLM key
                  npm run test -- --testPathPatterns="index.test.ts" --passWithNoTests

            - name: Cleanup
              if: always()
              run: |
                  docker stop agent-server || true
                  docker rm agent-server || true
