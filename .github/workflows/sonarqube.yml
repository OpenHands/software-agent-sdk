name: SonarQube

# Community Build has one branch per project, so a PR scan becomes the report card
# until the next push to main. That is wanted during the POC: it shows the repo's grade
# without merging first. pull_request_target must never be used -- unlike pull_request,
# it exposes secrets to fork-triggered runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    # Fork PRs get no secrets, so the scan could only fail on a missing token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube reads git history to attribute issues to authors.
          fetch-depth: 0
          persist-credentials: false

      # No dependency install: this repo is Python only, and the Python analyser works
      # from source. The JS and CSS the language stats show are not under sonar.sources.
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
