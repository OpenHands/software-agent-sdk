name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  agent-server-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.12
      uses: actions/setup-node@v6
      with:
        node-version: 22.12
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test Agent Server contract tooling
      run: npm run test:agent-server-api-tooling

    - name: Check generated Agent Server contract
      run: npm run check:agent-server-api

  public-type-budget:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.12
      uses: actions/setup-node@v6
      with:
        node-version: 22.12
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test weak-type ratchet behavior
      run: npm run test:public-type-budget

    - name: Check public weak-type budget
      run: npm run check:public-type-budget

  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.12, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Run type check
      run: npm run build
      
    - name: Run tests
      run: npm run test:coverage
      
    - name: Check formatting
      run: npm run format:check

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build package
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Gate production dependencies at moderate. Dev-only test tooling
    # (jest -> babel-plugin-istanbul -> @istanbuljs/load-nyc-config -> js-yaml@3)
    # carries advisories with no upstream fix and never ships to consumers, so
    # auditing them here would block merges indefinitely. --omit=dev scopes the
    # gate to what we actually publish.
    - name: Run security audit
      run: npm audit --audit-level=moderate --omit=dev

    - name: Check for vulnerabilities
      run: npm audit --audit-level=high --production

  validate-acp-providers:
    # Fail the build if src/models/acp-providers.json drifts from the
    # Python source of truth in openhands-sdk. Not gated by
    # continue-on-error — drift is a bug and must block merging.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Resolve openhands-sdk source
      id: sdk-source
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BODY: ${{ github.event.pull_request.body || '' }}
      run: |
        sdk_repo=OpenHands/software-agent-sdk
        sdk_ref=main
        if [[ "$PR_BODY" =~ github.com/OpenHands/software-agent-sdk/pull/([0-9]+) ]]; then
          sdk_pr=${BASH_REMATCH[1]}
          sdk_metadata=$(gh api "repos/OpenHands/software-agent-sdk/pulls/$sdk_pr")
          sdk_repo=$(jq -r '.head.repo.full_name' <<< "$sdk_metadata")
          sdk_ref=$(jq -r '.head.sha' <<< "$sdk_metadata")
        fi
        echo "repo=$sdk_repo" >> "$GITHUB_OUTPUT"
        echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

    - name: Install openhands-sdk
      run: >-
        pip install
        "openhands-sdk @ git+https://github.com/${{ steps.sdk-source.outputs.repo }}@${{ steps.sdk-source.outputs.ref }}#subdirectory=openhands-sdk"

    - name: Check ACP_PROVIDERS matches openhands-sdk
      env:
        OPENHANDS_SUPPRESS_BANNER: '1'
      run: python scripts/check-acp-drift.py
