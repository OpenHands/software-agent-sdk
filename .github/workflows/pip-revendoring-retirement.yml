---
name: Pip re-vendoring retirement

on:
    pull_request:
        paths:
            - openhands-agent-server/openhands/agent_server/docker/Dockerfile
            - tests/agent_server/docker_runtime/test_pip_revendoring_retirement.py
            - .github/workflows/pip-revendoring-retirement.yml
    schedule:
        - cron: 0 6 * * 1
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pip-revendoring-retirement:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Check upstream pip still needs re-vendoring
              run: uv run pytest -m docker_live tests/agent_server/docker_runtime/test_pip_revendoring_retirement.py
