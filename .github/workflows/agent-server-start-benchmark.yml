---
name: Agent Server Start Benchmark

on:
    pull_request:
        paths:
            - openhands-agent-server/**
            - openhands-tools/openhands/tools/terminal/**
            - openhands-sdk/openhands/sdk/conversation/**
            - openhands-sdk/openhands/sdk/mcp/**
            - scripts/agent_server_benchmarks/**
            - .github/workflows/agent-server-start-benchmark.yml

concurrency:
    group: agent-server-start-benchmark-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    benchmark:
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 40
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v7.0.1
              with:
                  path: head

            - name: Checkout PR base
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base

            - name: Checkout public extensions
              uses: actions/checkout@v7.0.1
              with:
                  repository: OpenHands/extensions
                  path: extensions

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Install base and head
              run: |
                  (cd base && uv sync --frozen --group dev)
                  (cd head && uv sync --frozen --group dev)
                  tmux -V

            - name: Run benchmark
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}@${{ github.event.pull_request.base.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.sha }}
              run: |
                  head/.venv/bin/python head/scripts/agent_server_benchmarks/conversation_start.py compare \
                    --base-python base/.venv/bin/python \
                    --head-python head/.venv/bin/python \
                    --base-ref "${BASE_REF:0:60}" --head-ref "${HEAD_REF:0:10}" \
                    --extensions-path "$PWD/extensions" \
                    --rounds 3 --creates 8 \
                    --report report.md
                  cat report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: agent-server-start-benchmark
                  path: |
                      report.md
                      report.json

            # Fork PRs get a read-only token; their report stays in the job summary.
            - name: Post or update PR comment
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('report.md', 'utf8');
                      const marker = body.split('\n')[0];
                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const existing = comments.find(c => c.body.startsWith(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
