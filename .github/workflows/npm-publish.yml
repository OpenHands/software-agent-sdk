name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # Manual re-publish for an already-pushed tag (e.g. when a prior run failed
  # before the publish step). Publishes the given version from the default
  # branch — the published tarball excludes .github/, so it is identical to the
  # tag's package contents.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to npmjs.org (no leading "v"), e.g. 1.24.0'
        required: true

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Trusted publishing requires Node 22.14.0+ and npm 11.5.1+
      # See: https://docs.npmjs.com/trusted-publishers/
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.x, but trusted publishing (OIDC) needs npm
      # 11.5.1+. setup-node does not upgrade the bundled npm, so do it
      # explicitly — without this the version guard below always fails.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify npm version supports trusted publishing
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          NPM_VERSION=$(npm --version)
          NPM_MAJOR=$(echo $NPM_VERSION | cut -d. -f1)
          NPM_MINOR=$(echo $NPM_VERSION | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || ([ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]); then
            echo "Error: npm 11.5.1+ required for trusted publishing, got $NPM_VERSION"
            exit 1
          fi
          echo "✓ npm $NPM_VERSION meets trusted publishing requirements"

      # The repo's .npmrc redirects @openhands to GitHub Packages;
      # remove it so this job publishes to the public npm registry.
      - name: Remove project .npmrc
        run: rm -f .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Set the version BEFORE build so any source that reads package.json at
      # compile time picks up the correct value. Supports a tag push (version
      # from the tag) and a manual re-run (version from the input).
      - name: Extract and set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
          else
            TARGET_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Publishing version: $TARGET_VERSION"
          npm version "$TARGET_VERSION" --no-git-tag-version

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Validate version was set
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
          else
            TARGET_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ "$PACKAGE_VERSION" != "$TARGET_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) doesn't match target ($TARGET_VERSION)"
            exit 1
          fi
          echo "✓ Version $PACKAGE_VERSION matches target"

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --tag latest
