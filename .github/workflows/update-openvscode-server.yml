---
name: Update OpenVSCode Server

on:
    schedule:
        - cron: 43 6 * * 1
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: update-openvscode-server
    cancel-in-progress: true

jobs:
    update-openvscode-server:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            GH_TOKEN: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}
            BRANCH: chore/update-openvscode-server-release
            DOCKERFILE: openhands-agent-server/openhands/agent_server/docker/Dockerfile
            IMAGE: openhands/agent-server-binary:openvscode-update
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}

            - name: Select the latest stable release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python .github/scripts/update_openvscode_server.py --dockerfile "$DOCKERFILE"

            - name: Build production image
              if: ${{ hashFiles('openhands-agent-server/openhands/agent_server/docker/Dockerfile') != '' }}
              run: |
                  if git diff --quiet; then
                      echo "OpenVSCode Server is already current."
                      exit 0
                  fi
                  docker build \
                    --target binary \
                    --tag "$IMAGE" \
                    --file "$DOCKERFILE" .

            - name: Open or refresh update PR
              env:
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if git diff --quiet; then
                      echo "OpenVSCode Server is already current."
                      exit 0
                  fi

                  RELEASE=$(sed -n 's/^ARG RELEASE_TAG="\(.*\)"$/\1/p' "$DOCKERFILE")
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin "$BRANCH" || true
                  git checkout -B "$BRANCH"
                  git add "$DOCKERFILE"
                  git commit -m "chore(agent-server): update OpenVSCode Server to $RELEASE" \
                    -m "Use the latest stable release after validating both architecture artifacts and the production image build." \
                    -m "Co-authored-by: openhands <openhands@all-hands.dev>"
                  git push --force-with-lease -u origin "$BRANCH"

                  BODY=$(cat <<EOF
                  ## Summary

                  Update the agent-server image to OpenVSCode Server \`$RELEASE\`.

                  The workflow verified the AMD64 and ARM64 release artifacts and successfully built the production \`binary\` image before opening this PR.

                  _This pull request was created by an automated OpenHands workflow on behalf of the maintainers._
                  EOF
                  )
                  EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
                  if [ -n "$EXISTING" ]; then
                      gh pr edit "$EXISTING" --repo "$REPO" \
                        --title "chore(agent-server): update OpenVSCode Server to $RELEASE" \
                        --body "$BODY"
                  else
                      gh pr create --repo "$REPO" --base main --head "$BRANCH" \
                        --title "chore(agent-server): update OpenVSCode Server to $RELEASE" \
                        --body "$BODY"
                  fi
