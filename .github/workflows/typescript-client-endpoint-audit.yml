---
name: TypeScript client endpoint audit

on:
    push:
        branches: [main]
  # Required for the "Comment audit report on PR" step: it is gated on
  # github.event_name == 'pull_request' and relies on the PR context
  # (context.issue.number), neither of which exists on a push event.
    pull_request:

# Needed so the audit can post its report as a comment on the PR.
permissions:
    contents: read
    pull-requests: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
  # Report divergences between handwritten Agent Server calls and the pinned
  # server's OpenAPI contract. See scripts/endpoint-audit.mjs.
    endpoint-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Test endpoint-audit tooling
              run: npm run test:endpoint-audit-tooling

            - name: Endpoint audit (report-only — client vs pinned release contract)
              run: npm run audit:endpoints

            - name: Upload audit report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: endpoint-audit
                  path: clients/typescript/.audit/
          # .audit/ is a dot-directory; upload-artifact@v4 skips hidden paths by default.
                  include-hidden-files: true

      # Render the report into the run's job summary. This is the path that
      # works everywhere: it needs no token, so it survives the read-only
      # GITHUB_TOKEN a fork PR gets, and it is where a contributor whose build
      # just went red will already be looking.
            - name: Write audit report to the job summary
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('node:fs');
                      const reportPath =
                        'clients/typescript/.audit/endpoint-audit.json';
                      if (!fs.existsSync(reportPath)) {
                        core.warning(`No audit report at ${reportPath}.`);
                        return;
                      }
                      const { renderEndpointAuditReport } = require(
                        './.github/scripts/post-typescript-endpoint-audit-report.cjs'
                      );
                      const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                      await core.summary
                        .addRaw(renderEndpointAuditReport(report))
                        .write();

      # Additionally post the report as a single, self-updating comment on the
      # PR. Runs even when the audit gate fails (the report is written before
      # the gate), so reviewers see the mismatches that failed the check.
      #
      # Skipped on forks: GitHub downgrades GITHUB_TOKEN to read-only for
      # pull_request events from a fork, so the `pull-requests: write` above is
      # granted as `PullRequests: read` and the comment API returns 403. The
      # report is still available from the artifact uploaded above.
            - name: Comment audit report on PR
              if: >-
                  always() && github.event_name == 'pull_request'
                  && github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@v7
              with:
                  script: |
                      const { postEndpointAuditReport } = require(
                        './.github/scripts/post-typescript-endpoint-audit-report.cjs'
                      );
                      await postEndpointAuditReport({
                        github,
                        context,
                        core,
                        reportPath: 'clients/typescript/.audit/endpoint-audit.json',
                      });
