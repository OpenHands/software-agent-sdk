---
name: TypeScript client endpoint audit

on:
    push:
        branches: [main]
    pull_request:

# pull-requests: write lets same-repo PR runs post the report as a comment.
# Fork pull_request runs get a read-only token regardless, so they and push
# runs publish the report to the job summary instead (see
# canCommentOnPullRequest in .github/scripts/post-typescript-endpoint-audit-report.cjs).
permissions:
    contents: read
    pull-requests: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
  # Report divergences between handwritten Agent Server calls and the pinned
  # server's OpenAPI contract. See scripts/endpoint-audit.mjs.
    endpoint-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Test endpoint-audit tooling
              run: npm run test:endpoint-audit-tooling

            - name: Endpoint audit (report-only — client vs pinned release contract)
              run: npm run audit:endpoints

            - name: Upload audit report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: endpoint-audit
                  path: clients/typescript/.audit/
          # .audit/ is a dot-directory; upload-artifact@v4 skips hidden paths by default.
                  include-hidden-files: true

      # Publish the report. It always lands in the job summary, and additionally
      # as a single self-updating PR comment when the run's token can write one
      # (same-repo pull requests). Runs even when the audit gate fails (the
      # report is written before the gate), so reviewers see the mismatches that
      # failed the check.
            - name: Publish audit report
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      const { postEndpointAuditReport } = require(
                        './.github/scripts/post-typescript-endpoint-audit-report.cjs'
                      );
                      await postEndpointAuditReport({
                        github,
                        context,
                        core,
                        reportPath: 'clients/typescript/.audit/endpoint-audit.json',
                      });
