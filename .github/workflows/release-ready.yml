---
name: release ready

# When the DRAFT release PR is marked "Ready for review", delegate to the
# reusable release-ready workflow. It labels the release PR (`release: ready`
# plus the `ready-labels` below) and posts to Slack. The ready-for-review action
# is the deliberate release-cut signal.
#
# The `ready-labels` are the SDK's test-trigger labels: adding them kicks off the
# integration / behavior / example suites, which trigger on the `labeled` event
# (see integration-runner.yml and run-examples.yml). release-ready adds them with
# the GitHub App token, so those `labeled` events actually fire.
#
# The trigger must live here because ready_for_review fires in the repo that owns
# the release PR. Safe under pull_request_target — release-ready.yml never checks
# out or runs PR code, refuses fork PRs, and requires an existing `autorelease:*`
# label before acting. Do NOT add a checkout step.
on:
    pull_request_target:
        types: [ready_for_review]

jobs:
    release-ready:
        permissions:
            # All four are required unconditionally. GitHub validates a called
            # workflow's job permissions statically at startup, before any `if:`
            # gating runs; release-ready.yml declares jobs needing `actions: write`
            # and `contents: write`, so granting `read` for either kills the run as
            # `startup_failure` with no jobs and no logs. `contents: write` is also
            # what `freeze-on-ready` needs to cut the freeze branch.
            actions: write
            contents: write
            issues: write
            pull-requests: write
        secrets: inherit # RELEASE_APP_* + SLACK_BOT_TOKEN
        uses: OpenHands/release-actions/.github/workflows/release-ready.yml@v0.3.0
        with:
            product-name: OpenHands Agent SDK
            slack-channel: '#proj-agent'
            # Marking the draft `chore(main): release X.Y.Z` PR ready cuts
            # `release/<major.minor>` at the PR's base SHA (via the App token, so
            # release-please picks it up) and returns this PR to draft, so commits
            # landing on `main` afterwards cannot enter this release. release-please
            # then opens the frozen release PR on `release/**`; marking THAT one
            # ready runs the normal label/Slack/test path below.
            freeze-on-ready: true
            ready-labels: |
                behavior-test
                integration-test
                test-examples
                security-scan
