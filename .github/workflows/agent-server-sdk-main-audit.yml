name: Agent Server SDK main drift audit

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-server-sdk-main-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout TypeScript client
        uses: actions/checkout@v4

      - name: Resolve exact SDK main commit
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(gh api repos/OpenHands/software-agent-sdk/commits/main --jq .sha)
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected SDK commit SHA: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Auditing OpenHands/software-agent-sdk@$SHA"

      - name: Checkout exact SDK commit
        uses: actions/checkout@v4
        with:
          repository: OpenHands/software-agent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: latest
          python-version: '3.13'
          enable-cache: false

      - name: Export exact SDK main OpenAPI
        env:
          OPENHANDS_SUPPRESS_BANNER: '1'
        run: |
          set -euo pipefail
          uv sync --directory sdk --frozen --dev
          (
            cd sdk
            uv run python .github/scripts/export_agent_server_openapi.py \
              --output "$RUNNER_TEMP/sdk-main-openapi.json"
          )

      - name: Use Node.js 22.12
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: 'npm'

      - name: Install client dependencies
        run: npm ci

      - name: Generate candidate and summarize drift
        id: drift
        env:
          AGENT_SERVER_OPENAPI_PATH: ${{ runner.temp }}/sdk-main-openapi.json
          AGENT_SERVER_SCHEMA_SOURCE: OpenHands/software-agent-sdk@${{ steps.sdk.outputs.sha }}
        run: |
          set -euo pipefail
          cp src/generated/agent-server-schema.ts \
            "$RUNNER_TEMP/pinned-agent-server-schema.ts"
          npm run generate:agent-server-api
          npm run summarize:agent-server-api -- \
            --before "$RUNNER_TEMP/pinned-agent-server-schema.ts" \
            --after src/generated/agent-server-schema.ts \
            --output "$RUNNER_TEMP/sdk-main-api-summary.md"
          if cmp -s \
            "$RUNNER_TEMP/pinned-agent-server-schema.ts" \
            src/generated/agent-server-schema.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render exact-SHA drift report
        env:
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/render-agent-server-drift-report.mjs \
            --sdk-sha "$SDK_SHA" \
            --summary "$RUNNER_TEMP/sdk-main-api-summary.md" \
            --package package.json \
            --run-url "$RUN_URL" \
            --output "$RUNNER_TEMP/sdk-main-drift-report.md"

      - name: Upload exact audit inputs and candidate
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-server-sdk-main-${{ steps.sdk.outputs.short }}
          path: |
            ${{ runner.temp }}/sdk-main-openapi.json
            ${{ runner.temp }}/sdk-main-api-summary.md
            ${{ runner.temp }}/sdk-main-drift-report.md
            src/generated/agent-server-schema.ts
          retention-days: 14
          if-no-files-found: error

      - name: Open, update, or resolve drift issue
        uses: actions/github-script@v8
        env:
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          DRIFT_CHANGED: ${{ steps.drift.outputs.changed }}
          DRIFT_REPORT_PATH: ${{ runner.temp }}/sdk-main-drift-report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-server-sdk-main-drift -->';
            const title = '[audit] Agent Server SDK main contract drift';
            const { owner, repo } = context.repo;
            const sha = process.env.SDK_SHA;
            const changed = process.env.DRIFT_CHANGED === 'true';
            const testedCommit =
              `https://github.com/OpenHands/software-agent-sdk/commit/${sha}`;
            const body = fs.readFileSync(process.env.DRIFT_REPORT_PATH, 'utf8');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker)
            );

            if (changed) {
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
                core.info(`Updated drift issue #${existing.number} for SDK ${sha}`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                });
                core.info(`Opened drift issue #${created.data.number} for SDK ${sha}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body:
                  `Resolved by exact audit of [\`${sha}\`](${testedCommit}); ` +
                  `the generated SDK-main contract matches the checked-in pin.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
              core.info(`Closed resolved drift issue #${existing.number}`);
            } else {
              core.info(`No drift at exact SDK commit ${sha}`);
            }

      - name: Record exact audited commit
        env:
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          DRIFT_CHANGED: ${{ steps.drift.outputs.changed }}
        run: |
          {
            echo "## Agent Server SDK main audit"
            echo ""
            echo "- Exact SDK commit: \`$SDK_SHA\`"
            echo "- Generated drift: \`$DRIFT_CHANGED\`"
          } >> "$GITHUB_STEP_SUMMARY"
