---
name: Ready-for-dev Label Policy

# The issue-triage automation owns readiness. This workflow only rejects a
# ready-for-dev label applied by another identity and refreshes linked PR gates
# after the authoritative label state changes.

on:
    issues:
        types: [labeled, unlabeled]

concurrency:
    group: ready-for-dev-policy-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    reject-unauthorized-label:
        name: Reject unauthorized ready-for-dev label
        if: >-
            github.event.issue.state == 'open'
            && github.event.issue.pull_request == null
            && github.event.action == 'labeled'
            && github.event.label.name == 'ready-for-dev'
            && github.event.sender.login != 'all-hands-bot'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Remove ready-for-dev label
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh issue edit "${{ github.event.issue.number }}"
                  --repo "${{ github.repository }}"
                  --remove-label ready-for-dev

    refresh-linked-pr-gates:
        name: Refresh PR gates for linked issues
        if: >-
            github.event.issue.state == 'open'
            && github.event.issue.pull_request == null
            && github.event.label.name == 'ready-for-dev'
            && (github.event.action == 'unlabeled'
                || github.event.sender.login == 'all-hands-bot')
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: read
            actions: write
        steps:
            - name: Checkout trusted workflow scripts
              uses: actions/checkout@v7

            - name: Re-run PR description checks for linked open PRs
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python .github/scripts/refresh_linked_pr_checks.py
