---
name: Check duplicate example numbers

on:
    pull_request:
        branches:
            - '**'
        paths:
            - examples/**
            - .github/workflows/check-duplicate-examples.yml
            - .github/scripts/check_duplicate_example_numbers.py
    push:
        branches:
            - main
        paths:
            - examples/**
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-duplicates:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: '3.13'

            - name: Check for duplicate example numbers
              run: python .github/scripts/check_duplicate_example_numbers.py

