---
name: Create Version Bump PRs

on:
    # Dispatched by pypi-release.yml after a successful publish.
    # Also supports manual reruns for a specific version.
    workflow_dispatch:
        inputs:
            version:
                description: Version to bump to (e.g., 1.11.3)
                required: true
                type: string

jobs:
    create-version-bump-prs:
        runs-on: ubuntu-24.04
        env:
            GH_TOKEN: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}
            SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Get version from release or input
              id: get_version
              env:
                  VERSION_INPUT: ${{ github.event.inputs.version }}
              run: |
                  VERSION="$VERSION_INPUT"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.2.3)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "📦 Version: $VERSION"

            - name: Validate version
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  if [ -z "$VERSION" ]; then
                    echo "❌ Version is empty"
                    exit 1
                  fi
                  echo "📦 Creating version bump PRs for version: $VERSION"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.12'
                  enable-cache: false

            - name: Wait for packages to be available on PyPI
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail

                  PACKAGES=(
                    openhands-sdk
                    openhands-tools
                    openhands-workspace
                    openhands-agent-server
                  )

                  MAX_ATTEMPTS=60
                  SLEEP_SECONDS=20

                  echo "⏳ Waiting for packages to be available on PyPI..."

                  # Use uv pip compile --dry-run to verify packages are resolvable
                  # via the Simple API (the same index uv add uses).
                  # The JSON API propagates faster than the Simple API, so a curl
                  # check alone is insufficient.
                  # Keep this isolated from the SDK repo's exclude-newer guardrail:
                  # this workflow intentionally consumes just-published packages.
                  for PKG in "${PACKAGES[@]}"; do
                    echo "Checking $PKG==$VERSION..."
                    ATTEMPT=1
                    while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
                      if uv pip compile --no-config --no-cache --python-version 3.12 - <<< "$PKG==$VERSION" > /dev/null 2>&1; then
                        echo "✅ $PKG==$VERSION is resolvable on PyPI"
                        break
                      fi

                      echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS: $PKG==$VERSION not yet resolvable, waiting ${SLEEP_SECONDS}s..."
                      sleep $SLEEP_SECONDS
                      ATTEMPT=$((ATTEMPT + 1))
                    done

                    if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                      echo "❌ Timeout waiting for $PKG==$VERSION to be resolvable on PyPI"
                      exit 1
                    fi
                  done

                  echo "✅ All packages are resolvable on PyPI!"

            - name: Create PR for OpenHands-CLI repo
              id: cli_pr
              continue-on-error: true
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail

                  REPO="OpenHands/openhands-cli"
                  BRANCH="bump-sdk-$VERSION"

                  echo "🔄 Creating PR for $REPO..."

                  # Clone the repo
                  git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" openhands-cli-repo
                  cd openhands-cli-repo

                  # Configure git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Check if branch already exists on remote
                  if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
                    echo "⚠️ Branch $BRANCH already exists, checking out existing branch"
                    git fetch origin "$BRANCH"
                    git checkout "$BRANCH"
                  else
                    # Create branch
                    git checkout -b "$BRANCH"
                  fi

                  # OpenHands-CLI currently requires Python 3.12, so resolve with that interpreter.
                  # The target repo uses exclude-newer-package to exempt openhands-sdk/tools
                  # from its 7-day freshness guardrail, so no UV_EXCLUDE_NEWER override
                  # is needed — doing so would actually break the per-package exemptions.
                  # We use --no-cache to avoid stale index data from just-published packages.
                  uv add --python 3.12 --no-cache \
                    "openhands-sdk==$VERSION" \
                    "openhands-tools==$VERSION"

                  # Check if there are changes
                  if git diff --quiet; then
                    echo "⚠️ No changes detected in $REPO - versions may already be up to date"
                    exit 0
                  fi

                  # Commit and push
                  git add pyproject.toml uv.lock
                  git commit -m "Bump openhands-sdk, openhands-tools to $VERSION" \
                    -m "Automated version bump after PyPI release." \
                    -m "Co-authored-by: openhands <openhands@all-hands.dev>"
                  git push -u origin "$BRANCH"

                  # Check if PR already exists
                  EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "✅ PR #$EXISTING_PR already exists for $REPO"
                  else
                    # Create PR
                    gh pr create \
                      --repo "$REPO" \
                      --title "Bump SDK packages to v$VERSION" \
                      --body "## Automated Version Bump

                  This PR updates the following packages to version **$VERSION**:
                  - \`openhands-sdk\`
                  - \`openhands-tools\`

                  **Triggered by:** Release of [software-agent-sdk v$VERSION](https://github.com/OpenHands/software-agent-sdk/releases/tag/v$VERSION)

                  ---
                  _This PR was automatically created by the version-bump-prs workflow._" \
                      --base main \
                      --head "$BRANCH"

                    echo "✅ PR created for $REPO"
                  fi

            - name: Create PR for automation repo
              id: automation_pr
              continue-on-error: true
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail

                  REPO="OpenHands/automation"
                  BRANCH="bump-sdk-$VERSION"

                  echo "🔄 Creating PR for $REPO..."

                  # Clone the repo
                  git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" automation-repo
                  cd automation-repo

                  # Configure git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Check if branch already exists on remote
                  if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
                    echo "⚠️ Branch $BRANCH already exists, checking out existing branch"
                    git fetch origin "$BRANCH"
                    git checkout "$BRANCH"
                  else
                    # Create branch
                    git checkout -b "$BRANCH"
                  fi

                  # automation pins openhands-sdk + openhands-workspace as exact
                  # PEP 621 dependencies and keeps a uv.lock. Update the pins with
                  # sed (exact, no normalization), then regenerate the lock.
                  echo "📝 Updating pyproject.toml SDK pins..."
                  sed -i -E 's/"openhands-sdk==[^"]*"/"openhands-sdk=='"$VERSION"'"/' pyproject.toml
                  sed -i -E 's/"openhands-workspace==[^"]*"/"openhands-workspace=='"$VERSION"'"/' pyproject.toml

                  # --no-config bypasses ~/.config/uv/uv.toml where setup-uv writes
                  # its 7-day freshness guardrail (automation has no
                  # exclude-newer-package exemption of its own); --no-cache avoids
                  # stale index data from the just-published packages.
                  echo "📝 Regenerating uv.lock..."
                  uv lock --no-cache --no-config

                  # Check if there are changes
                  if git diff --quiet; then
                    echo "⚠️ No changes detected in $REPO - versions may already be up to date"
                    exit 0
                  fi

                  # Commit and push. Use a Conventional Commit `fix:` subject so the
                  # target repo's release-please opens a release PR on merge — that
                  # published openhands-automation is what unblocks agent-canvas's
                  # sdk-version-sync check.
                  git add pyproject.toml uv.lock
                  git commit -m "fix: bump SDK to $VERSION" \
                    -m "Bump openhands-sdk, openhands-workspace to $VERSION (regenerated uv.lock)." \
                    -m "Automated version bump after PyPI release." \
                    -m "Co-authored-by: openhands <openhands@all-hands.dev>"
                  git push -u origin "$BRANCH"

                  # Check if PR already exists
                  EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "✅ PR #$EXISTING_PR already exists for $REPO"
                  else
                    # Create PR with a `chore:` title to match the automation
                    # repo's bump-PR convention (and the other steps here).
                    # release-please still cuts a patch release: the repo squashes
                    # single-commit PRs using the commit message (the `fix:` subject
                    # above), not the PR title (squash_title_source is
                    # COMMIT_OR_PR_TITLE).
                    gh pr create \
                      --repo "$REPO" \
                      --title "chore: bump SDK to $VERSION" \
                      --body "## Automated Version Bump

                  This PR updates the following packages to version **$VERSION**:
                  - \`openhands-sdk\`
                  - \`openhands-workspace\`

                  **Triggered by:** Release of [software-agent-sdk v$VERSION](https://github.com/OpenHands/software-agent-sdk/releases/tag/v$VERSION)

                  ---
                  _This PR was automatically created by the version-bump-prs workflow._" \
                      --base main \
                      --head "$BRANCH"

                    echo "✅ PR created for $REPO"
                  fi

            - name: Create PR for enterprise repo
              id: enterprise_pr
              continue-on-error: true
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail

                  REPO="OpenHands/enterprise"
                  BRANCH="bump-sdk-$VERSION"

                  echo "🔄 Creating PR for $REPO..."

                  # Clone the repo
                  git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" enterprise-repo
                  cd enterprise-repo

                  # Configure git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Check if branch already exists on remote
                  if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
                    echo "⚠️ Branch $BRANCH already exists, checking out existing branch"
                    git fetch origin "$BRANCH"
                    git checkout "$BRANCH"
                  else
                    # Create branch
                    git checkout -b "$BRANCH"
                  fi

                  # enterprise pins openhands-sdk + openhands-agent-server + openhands-tools as
                  # exact PEP 621 dependencies and keeps a uv.lock. Update the pins with
                  # sed (exact, no normalization), then regenerate the lock, keeping the
                  # project's own [tool.uv] table (exclude-newer + exclude-newer-package)
                  # intact so the regenerated lock still satisfies `uv sync --locked`in CI.

                  echo "📝 Updating pyproject.toml SDK pins..."
                  sed -i -E 's/"openhands-sdk==[^"]*"/"openhands-sdk=='"$VERSION"'"/' pyproject.toml
                  sed -i -E 's/"openhands-agent-server==[^"]*"/"openhands-agent-server=='"$VERSION"'"/' pyproject.toml
                  sed -i -E 's/"openhands-tools==[^"]*"/"openhands-tools=='"$VERSION"'"/' pyproject.toml

                  # --no-cache avoids stale index data from the just-published packages.

                  echo "📝 Regenerating uv.lock..."
                  uv lock --no-cache

                  # Check if there are changes
                  if git diff --quiet; then
                    echo "⚠️ No changes detected in $REPO - versions may already be up to date"
                    exit 0
                  fi

                  # Commit and push. Use a Conventional Commit `chore(deps):` subject so the
                  # target repo's release-please does not cut a release from these bumps
                  # (the manual bump this replaces, #484, used the same convention).
                  git add pyproject.toml uv.lock
                  git commit -m "chore(deps): bump SDK to $VERSION" \
                    -m "Bump openhands-sdk, openhands-agent-server, openhands-tools to $VERSION (regenerated uv.lock)." \
                    -m "Automated version bump after PyPI release." \
                    -m "Co-authored-by: openhands <openhands@all-hands.dev>"
                  git push -u origin "$BRANCH"

                  # Check if PR already exists
                  EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "✅ PR #$EXISTING_PR already exists for $REPO"
                  else
                    # Create PR with a `chore:` title to match the bump-PR convention.

                    gh pr create \
                      --repo "$REPO" \
                      --title "chore: bump SDK to $VERSION" \
                      --body "## Automated Version Bump

                  This PR updates the following packages to version **$VERSION**:
                  - \`openhands-sdk\`
                  - \`openhands-agent-server\`
                  - \`openhands-tools\`

                  **Triggered by:** Release of [software-agent-sdk v$VERSION](https://github.com/OpenHands/software-agent-sdk/releases/tag/v$VERSION)

                  ---
                  _This PR was automatically created by the version-bump-prs workflow._" \
                      --base main \
                      --head "$BRANCH"

                    echo "✅ PR created for $REPO"
                  fi

            - name: Summary
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  CLI_OUTCOME: ${{ steps.cli_pr.outcome }}
                  AUTOMATION_OUTCOME: ${{ steps.automation_pr.outcome }}
                  ENTERPRISE_OUTCOME: ${{ steps.enterprise_pr.outcome }}
              run: |
                  echo "## Version Bump PRs" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Results of bumping SDK packages to version **$VERSION**:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  # The "Create PR" steps use continue-on-error, so surface any
                  # failure here instead of silently linking to a PR that was
                  # never created.
                  if [ "$CLI_OUTCOME" = "failure" ]; then
                    echo "- ⚠️ **OpenHands-CLI PR creation FAILED** — see the \"Create PR for OpenHands-CLI repo\" step logs" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "- [OpenHands-CLI](https://github.com/OpenHands/openhands-cli/pulls?q=is%3Apr+bump-sdk-$VERSION)" >> $GITHUB_STEP_SUMMARY
                  fi
                  if [ "$AUTOMATION_OUTCOME" = "failure" ]; then
                    echo "- ⚠️ **automation PR creation FAILED** — see the \"Create PR for automation repo\" step logs" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "- [automation](https://github.com/OpenHands/automation/pulls?q=is%3Apr+bump-sdk-$VERSION)" >> $GITHUB_STEP_SUMMARY
                  fi
                  if [ "$ENTERPRISE_OUTCOME" = "failure" ]; then
                    echo "- ⚠️ **enterprise PR creation FAILED** — see the \"Create PR for enterprise repo\" step logs" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "- [enterprise](https://github.com/OpenHands/enterprise/pulls?q=is%3Apr+bump-sdk-$VERSION)" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Notify Slack
              if: env.SLACK_BOT_TOKEN != ''
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  method: chat.postMessage
                  token: ${{ env.SLACK_BOT_TOKEN }}
                  payload: |
                      channel: C08E1SYKEM9
                      text: "🚀 *SDK v${{ steps.get_version.outputs.version }} published to PyPI!*\n\nVersion bump PRs created:\n• <https://github.com/OpenHands/openhands-cli/pulls?q=is%3Apr+bump-sdk-${{ steps.get_version.outputs.version }}|OpenHands-CLI>\n• <https://github.com/OpenHands/automation/pulls?q=is%3Apr+bump-sdk-${{ steps.get_version.outputs.version }}|automation>\n\n<https://github.com/OpenHands/software-agent-sdk/releases/tag/v${{ steps.get_version.outputs.version }}|View Release>"

    bump-typescript-client:
        # Open a PR in this repository bumping the TypeScript client's pinned
        # agent-server image and generated contract to this SDK release.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}
        steps:
            - name: Checkout SDK release tooling
              uses: actions/checkout@v7
              with:
                  # The default GITHUB_TOKEN cannot push the bump branch.
                  token: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Get version
              id: get_version
              env:
                  VERSION_INPUT: ${{ github.event.inputs.version }}
              run: |
                  VERSION="$VERSION_INPUT"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.30.0)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "📦 Version: $VERSION"

            - name: Wait for agent-server image in GHCR
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail
                  IMAGE="ghcr.io/openhands/agent-server:${VERSION}-python"
                  for ATTEMPT in $(seq 1 90); do
                    if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                      echo "✅ ${IMAGE} is published"
                      exit 0
                    fi
                    echo "Attempt $ATTEMPT/90: waiting 30s for ${IMAGE}"
                    sleep 30
                  done
                  echo "❌ Timeout waiting for ${IMAGE}"
                  exit 1

            - name: Obtain exact OpenAPI release artifact
              id: openapi
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail
                  ARTIFACT_DIR="$RUNNER_TEMP/agent-server-$VERSION-openapi"
                  OPENAPI_PATH="$ARTIFACT_DIR/openapi.json"
                  mkdir -p "$ARTIFACT_DIR"
                  for ATTEMPT in $(seq 1 90); do
                    if gh release download "v$VERSION" \
                      --repo "${{ github.repository }}" \
                      --pattern openapi.json \
                      --dir "$ARTIFACT_DIR" \
                      --clobber > /dev/null 2>&1; then
                      jq -e --arg version "$VERSION" \
                        '.info.version == $version' "$OPENAPI_PATH" > /dev/null
                      echo "path=$OPENAPI_PATH" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    echo "Attempt $ATTEMPT/90: waiting 20s for openapi.json"
                    sleep 20
                  done
                  echo "❌ Timeout waiting for SDK release v${VERSION} openapi.json"
                  exit 1

            - name: Open TypeScript client bump PR
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  OPENAPI_PATH: ${{ steps.openapi.outputs.path }}
              run: |
                  set -euo pipefail
                  REPO="${{ github.repository }}"
                  BRANCH="bump-typescript-agent-server-$VERSION"
                  CLIENT_ROOT="clients/typescript"
                  BEFORE_SCHEMA="$RUNNER_TEMP/agent-server-schema-before.ts"
                  API_SUMMARY="$RUNNER_TEMP/agent-server-api-summary.md"

                  git fetch origin main
                  git checkout -B "$BRANCH" origin/main
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  CURRENT=$(node -p "require('./$CLIENT_ROOT/package.json').config.agentServerImage.match(/agent-server:([0-9.]+)-python/)[1]")
                  if [ "$CURRENT" = "$VERSION" ]; then
                    echo "✅ TypeScript client already pinned to $VERSION"
                    exit 0
                  fi

                  cp "$CLIENT_ROOT/src/generated/agent-server-schema.ts" "$BEFORE_SCHEMA"
                  npm ci --prefix "$CLIENT_ROOT"
                  python .github/scripts/prepare_typescript_client_agent_server_bump.py \
                    --client-root "$CLIENT_ROOT" \
                    --version "$VERSION" \
                    --openapi "$OPENAPI_PATH"
                  (
                    cd "$CLIENT_ROOT"
                    AGENT_SERVER_OPENAPI_PATH="$OPENAPI_PATH" npm run generate:agent-server-api
                    npm run summarize:agent-server-api -- \
                      --before "$BEFORE_SCHEMA" \
                      --after src/generated/agent-server-schema.ts \
                      --output "$API_SUMMARY"
                  )

                  if git diff --quiet; then
                    echo "⚠️ No changes produced"
                    exit 0
                  fi

                  git add "$CLIENT_ROOT/package.json" "$CLIENT_ROOT/AGENTS.md" \
                    "$CLIENT_ROOT/README.md" "$CLIENT_ROOT/src/generated/agent-server-schema.ts"
                  git commit -m "chore(typescript): agent-server to v$VERSION"
                  git push --force-with-lease -u origin "$BRANCH"

                  EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "✅ PR #$EXISTING_PR already exists"
                    exit 0
                  fi

                  cat > "$RUNNER_TEMP/pr_body.md" <<EOF
                  ## Bump tracked Agent Server version

                  Updates `clients/typescript` from Agent Server v${CURRENT} to v${VERSION} and regenerates its checked-in OpenAPI contract.

                  ## Agent Server API change summary

                  $(cat "$API_SUMMARY")

                  Triggered by https://github.com/OpenHands/software-agent-sdk/releases/tag/v${VERSION}.
                  EOF
                  gh pr create --repo "$REPO" --base main --head "$BRANCH" \
                    --title "chore(typescript): agent-server to v$VERSION" \
                    --body-file "$RUNNER_TEMP/pr_body.md"

            - name: Summary
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  echo "TypeScript client bump: https://github.com/${{ github.repository }}/pulls?q=is%3Apr+bump-typescript-agent-server-$VERSION" >> "$GITHUB_STEP_SUMMARY"

    bump-cloud-chart:
        # After an SDK release, bump the agent-server image tag pinned in the
        # openhands-cloud charts (three locations) so the Check agent-server sync
        # gate never trips on a stale pin. Shares the pypi-release dispatch chain
        # and image-readiness wait used by bump-typescript-client.
        #
        # The sync gate compares this agent-server tag against the SDK version the
        # chart's pinned enterprise-server release was built against (see
        # OpenHands/OpenHands-Cloud scripts/check_agent_server_sync.py). This job
        # is only correct because the same version-bump-prs.yml run also opens the
        # enterprise SDK-pin bump PR (create-version-bump-prs), so the two pins
        # move together and are merged together in the same release cycle.
        concurrency:
            group: bump-image-tag-OpenHands-OpenHands-Cloud-agent-server
            cancel-in-progress: false
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Get version
              id: get_version
              env:
                  VERSION_INPUT: ${{ github.event.inputs.version }}
              run: |
                  VERSION="$VERSION_INPUT"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.49.5)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "image_tag=${VERSION}-python" >> "$GITHUB_OUTPUT"

            - name: Wait for agent-server image in GHCR
              env:
                  IMAGE_TAG: ${{ steps.get_version.outputs.image_tag }}
              run: |
                  set -euo pipefail
                  IMAGE="ghcr.io/openhands/agent-server:${IMAGE_TAG}"
                  for ATTEMPT in $(seq 1 90); do
                    if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                      echo "✅ ${IMAGE} is published"
                      exit 0
                    fi
                    echo "Attempt $ATTEMPT/90: waiting 30s for ${IMAGE}"
                    sleep 30
                  done
                  echo "❌ Timeout waiting for ${IMAGE}"
                  exit 1

            # Auth choice: the sibling jobs open PRs in public repos with the
            # PAT, but cloud chart bumps write to the private OpenHands-Cloud
            # repo, so this job uses the shared release App (RELEASE_APP_ID /
            # RELEASE_APP_PRIVATE_KEY) exactly like the enterprise and
            # agent-canvas callers, with deliberately no PAT/GITHUB_TOKEN fallback.
            - name: Mint GitHub App token (scoped to OpenHands-Cloud)
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: OpenHands
                  repositories: OpenHands-Cloud

            - name: Checkout chart repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: OpenHands/OpenHands-Cloud
                  ref: main
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: false

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.12'
                  enable-cache: false

            - name: Bump agent-server image tag (three pin locations)
              env:
                  IMAGE_TAG: ${{ steps.get_version.outputs.image_tag }}
              run: |
                  set -euo pipefail
                  # The chart repo's blessed edit script: path-aware, idempotent,
                  # preserves quoting/comments/blank lines, verifies after writing.
                  uv run scripts/bump_image_tag/bump_image_tag.py \
                      --file charts/image-loader/values.yaml \
                      --path .image.tag \
                      --tag "$IMAGE_TAG"
                  uv run scripts/bump_image_tag/bump_image_tag.py \
                      --file charts/openhands/charts/runtime-api/values.yaml \
                      --path .global.agentServerImage.tag \
                      --tag "$IMAGE_TAG"
                  uv run scripts/bump_image_tag/bump_image_tag.py \
                      --file charts/openhands/values.yaml \
                      --path .global.agentServerImage.tag \
                      --tag "$IMAGE_TAG"

            - name: Create or update pull request
              id: cpr
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  add-paths: |
                      charts/image-loader/values.yaml
                      charts/openhands/charts/runtime-api/values.yaml
                      charts/openhands/values.yaml
                  base: main
                  branch: bump-image-tag/agent-server
                  delete-branch: true
                  commit-message: 'feat(agent-server): bump image tag to ${{ steps.get_version.outputs.image_tag }}'
                  title: 'feat(agent-server): bump image tag to ${{ steps.get_version.outputs.image_tag }}'
                  labels: automated,image-bump
                  body: |
                      Automated image tag bump for **agent-server** after the
                      [software-agent-sdk v${{ steps.get_version.outputs.version }} release](https://github.com/OpenHands/software-agent-sdk/releases/tag/v${{ steps.get_version.outputs.version }}).

                      | File | Path |
                      | --- | --- |
                      | `charts/image-loader/values.yaml` | `.image.tag` |
                      | `charts/openhands/charts/runtime-api/values.yaml` | `.global.agentServerImage.tag` |
                      | `charts/openhands/values.yaml` | `.global.agentServerImage.tag` |

                      Opened by the software-agent-sdk `version-bump-prs.yml` workflow.

            - name: Summary
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  IMAGE_TAG: ${{ steps.get_version.outputs.image_tag }}
                  URL: ${{ steps.cpr.outputs.pull-request-url }}
              run: |
                  echo "Cloud chart bump (agent-server → ${IMAGE_TAG}): ${URL}" >> "$GITHUB_STEP_SUMMARY"
