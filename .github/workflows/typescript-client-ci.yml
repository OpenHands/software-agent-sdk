---
name: TypeScript client CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

defaults:
    run:
        working-directory: clients/typescript

jobs:
    agent-server-api:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install uv and Python 3.13
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Test Agent Server contract tooling
              run: npm run test:agent-server-api-tooling

            # A release PR pins a version whose openapi.json is published only after merge.
            - name: Resolve pinned Agent Server
              id: pinned
              working-directory: .
              run: python3 .github/scripts/resolve_typescript_client_agent_server.py

            - name: Install uv
              if: steps.pinned.outputs.use_source_contract == 'true'
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Export unreleased Agent Server contract from source
              if: steps.pinned.outputs.use_source_contract == 'true'
              working-directory: .
              run: |
                  uv sync --frozen --package openhands-agent-server
                  OPENHANDS_SUPPRESS_BANNER=1 uv run python .github/scripts/export_agent_server_openapi.py \
                    --output "$RUNNER_TEMP/openapi.json"
                  echo "AGENT_SERVER_OPENAPI_PATH=$RUNNER_TEMP/openapi.json" >> "$GITHUB_ENV"

            - name: Check generated Agent Server contract
              run: npm run check:agent-server-api

            - name: Check generated prompt enhancement contract
              run: npm run check:prompt-enhancement-api

    public-type-budget:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Test weak-type ratchet behavior
              run: npm run test:public-type-budget

            - name: Check public weak-type budget
              run: npm run check:public-type-budget

    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run build

            - name: Run tests
              run: npm run test:coverage

            - name: Check formatting
              run: npm run format:check

    build:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build package
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: clients/typescript/dist/
                  retention-days: 7

    security:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Install dependencies
              run: npm ci

    # Gate production dependencies at moderate. Dev-only test tooling
    # (jest -> babel-plugin-istanbul -> @istanbuljs/load-nyc-config -> js-yaml@3)
    # carries advisories with no upstream fix and never ships to consumers, so
    # auditing them here would block merges indefinitely. --omit=dev scopes the
    # gate to what we actually publish.
            - name: Run security audit
              run: npm audit --audit-level=moderate --omit=dev

            - name: Check for vulnerabilities
              run: npm audit --audit-level=high --production

    validate-acp-providers:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Install Python workspace
              working-directory: .
              run: uv sync --frozen --package openhands-sdk

            - name: Check ACP_PROVIDERS matches openhands-sdk
              working-directory: .
              env:
                  OPENHANDS_SUPPRESS_BANNER: '1'
              run: uv run python clients/typescript/scripts/check-acp-drift.py
