---
name: Publish TypeScript client to GitHub Packages

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish without a leading v
                required: true
                type: string

concurrency:
    group: typescript-client-github-packages-publish-${{ inputs.version }}
    cancel-in-progress: false


permissions:
    contents: read
    packages: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Check out release tag
              uses: actions/checkout@v4
              with:
                  ref: v${{ inputs.version }}

            - name: Set up Node.js for GitHub Packages
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json
                  registry-url: https://npm.pkg.github.com
                  scope: '@openhands'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Validate package version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  current_version=$(node -p "require('./package.json').version")
                  if [ "$current_version" != "$VERSION" ]; then
                    echo "Package version $current_version does not match requested version $VERSION"
                    exit 1
                  fi

            - name: Build package
              run: npm run build

            - name: Publish to GitHub Packages
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
