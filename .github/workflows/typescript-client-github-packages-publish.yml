---
name: Publish TypeScript client to GitHub Packages

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish without a leading v
                required: true
                type: string

permissions:
    contents: read
    packages: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
    publish:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (!github.event.release.prerelease &&
             startsWith(github.event.release.tag_name, 'v'))
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js for GitHub Packages
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json
                  registry-url: https://npm.pkg.github.com
                  scope: '@openhands'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Set package version
              env:
                  DISPATCH_VERSION: ${{ inputs.version }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [ "${{ github.event_name }}" = workflow_dispatch ]; then
                    target_version="$DISPATCH_VERSION"
                  else
                    target_version="${RELEASE_TAG#v}"
                  fi
                  npm version "$target_version" --no-git-tag-version --allow-same-version

            - name: Build package
              run: npm run build

            - name: Publish to GitHub Packages
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
