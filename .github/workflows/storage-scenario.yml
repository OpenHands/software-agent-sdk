---
name: Storage scenario

on:
    pull_request:
        paths:
            - openhands-agent-server/openhands/agent_server/storage/**
            - openhands-agent-server/openhands/agent_server/docker_runtime/**
            - tests/agent_server/docker_runtime/test_storage_scenario.py
            - .github/workflows/storage-scenario.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    storage-scenario:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Pull agent-server image
              run: docker pull ghcr.io/openhands/agent-server:latest-python

            - name: Run storage scenario
              run: uv run pytest -m docker_live tests/agent_server/docker_runtime/test_storage_scenario.py
